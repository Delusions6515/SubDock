version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub-minor:
        patterns:
          - "*"
        update-types:
          - minor
      pub-patch:
        patterns:
          - "*"
        update-types:
          - patch
